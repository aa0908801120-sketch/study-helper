<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245746"><title>讀書小幫手｜把專注留給重要的事</title><style>
:root{--bg:#f7f5ef;--green:#245746;--ink:#293e35;--muted:#6e7c73;--line:#e2e7df;--light:#edf3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--green);padding:10px 16px;border-radius:12px;font-weight:650;transition:background .15s,transform .15s}button:hover:not(:disabled){background:var(--light)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{cursor:not-allowed;opacity:.45}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover:not(:disabled){background:#183f32}button.danger{color:#a54532}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b7ca85;outline-offset:3px}input,select{width:100%;min-width:0;border:1px solid #ced8cd;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}input:disabled,select:disabled{background:#f0f1ed;color:#7d887f}label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}small,.muted{color:var(--muted)}header{border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.logo{background:var(--green);color:#fff;display:grid;place-items:center;width:36px;height:36px;border-radius:12px}.nav small{font-size:12px}main{max-width:1180px;padding:40px 28px;margin:auto}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:750;color:var(--green)}h1{font-size:clamp(26px,4vw,38px);margin:6px 0 8px;letter-spacing:-1px}h2{font-size:20px;margin:0}p{margin:0}.intro{margin-bottom:28px}.stats{display:grid;grid-template-columns:repeat(3,1fr) 1.6fr;border:1px solid var(--line);background:#fff;border-radius:18px;margin-bottom:28px;padding:22px 8px}.stat{padding:0 22px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{font-size:30px;font-weight:650;display:block;font-variant-numeric:tabular-nums}.stat small{font-size:12px}.progress{height:8px;background:#e9eee5;border-radius:8px;overflow:hidden;margin-top:12px}.progress div{height:100%;background:var(--green);transition:width .3s}.columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 5px 18px #273b2404}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.section-number{font-size:11px;color:#8a968b;letter-spacing:2px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}.filters{display:flex;gap:10px;margin:26px 0 16px;align-items:end}.filters>div{flex:1;min-width:0}.list{display:grid;gap:12px}.task{border:1px solid var(--line);border-radius:14px;padding:16px}.task-top{display:flex;gap:12px;align-items:flex-start}.check{width:20px;height:20px;accent-color:var(--green);flex:none;margin-top:5px;cursor:pointer}.task-body{min-width:0;flex:1}.task h3{font-size:16px;margin:5px 0;overflow-wrap:anywhere}.task.done h3{text-decoration:line-through;color:#839087}.subject{font-size:11px;letter-spacing:.5px;color:var(--green);overflow-wrap:anywhere}.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px}.tag{border-radius:6px;padding:2px 7px;background:#f1f3ee;color:#536554}.high,.overdue{color:#a04732;background:#fbece6}.mid,.today{color:#926c23;background:#faf2d9}.tomorrow{background:#eaf1e3;color:#49703d}.task-foot{margin-top:13px;display:flex;gap:7px;flex-wrap:wrap}.task-foot button{font-size:12px;padding:6px 10px;border-radius:8px}.task-foot .focus{margin-right:auto}.empty{text-align:center;padding:32px 15px;border:1px dashed #cdd7c8;border-radius:14px;color:var(--muted)}.empty b{display:block;color:var(--green);margin-bottom:6px}.timer-panel{position:sticky;top:24px;background:#fdfefa}.mode{display:inline-block;background:#e9efdf;color:var(--green);border-radius:30px;padding:4px 13px;font-size:12px}.timer-header{text-align:center;margin:23px 0 5px}.dial{width:min(100%,265px);aspect-ratio:1;margin:18px auto;position:relative;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--green) var(--angle,0deg),#e6ecdf 0)}.dial:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fdfefa}.dial-content{z-index:1;text-align:center}.clock{font-size:clamp(42px,6vw,56px);font-variant-numeric:tabular-nums;letter-spacing:-2px;line-height:1.3;font-weight:550}.clock-note{font-size:12px;color:var(--muted)}.current{font-size:13px;color:var(--muted);text-align:center;overflow-wrap:anywhere;min-height:24px;margin-bottom:18px}.timer-actions{display:flex;gap:10px}.timer-actions .primary{flex:1}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.help{font-size:11px;line-height:1.8;margin-top:12px;color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#edf4e6;color:#355d32;margin:14px 0;font-size:13px}.notice:empty{display:none}footer{padding:28px 0 0;text-align:center;font-size:11px;color:var(--muted)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:#203e31;color:white;border-radius:12px;padding:12px 20px;z-index:20;box-shadow:0 8px 28px #0002}#toast:empty{display:none}#storageWarning{background:#fff0d6;color:#7c591f;padding:12px 20px;font-size:13px}dialog{border:1px solid var(--line);border-radius:18px;padding:26px;max-width:440px;width:calc(100% - 32px);color:var(--ink)}dialog::backdrop{background:#18382d66}dialog p{margin:14px 0 22px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}[hidden]{display:none!important}@media(max-width:800px){.columns{grid-template-columns:1fr}.timer-panel{position:static}.stats{grid-template-columns:repeat(3,1fr);gap:18px}.stat:nth-child(3){border:0}.stat:last-child{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}.nav,main{padding-left:18px;padding-right:18px}.nav small{display:none}.panel{padding:20px}.stat{padding:0 14px}.stat strong{font-size:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media(max-width:380px){.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.filters{flex-direction:column;align-items:stretch}.panel{padding:16px}}
</style></head><body>
<header><div class="nav"><div class="brand"><span class="logo" aria-hidden="true">葉</span>讀書小幫手</div><small>一件任務，一段專注。</small><span class="section-number">STUDY COMPANION</span></div></header>
<div id="storageWarning" role="alert" hidden></div>
<main><section class="intro"><span class="eyebrow">MAKE ROOM FOR FOCUS</span><h1>把專注，留給重要的事。</h1><p class="muted">整理今天的任務，從一小段專注開始。</p></section>
<section class="stats" aria-label="全部任務統計"><div class="stat"><small>全部任務</small><strong id="total">0</strong></div><div class="stat"><small>已完成</small><strong id="done">0</strong></div><div class="stat"><small>待完成</small><strong id="pending">0</strong></div><div class="stat"><small>整體完成進度</small><strong id="percent">0%</strong><div class="progress" role="progressbar" aria-label="任務完成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="bar"></div></div></div></section>
<div class="columns"><section class="panel"><div class="panel-title"><h2 id="formTitle">安排讀書任務</h2><span class="section-number">01 / PLAN</span></div>
<form id="taskForm"><div class="form-grid"><div><label for="subject">科目</label><input id="subject" maxlength="30" required placeholder="例如：半導體物理" list="subjects"><datalist id="subjects"></datalist></div><div><label for="priority">優先程度</label><select id="priority"><option value="high">高</option><option value="mid" selected>中</option><option value="low">低</option></select></div><div class="wide"><label for="title">任務名稱</label><input id="title" maxlength="80" required placeholder="這次想完成什麼？"></div><div class="wide"><label for="due">截止日期</label><input id="due" type="date" required></div></div><div class="form-actions"><button type="button" id="cancelEdit" hidden>取消編輯</button><button class="primary" id="saveTask" type="submit">＋ 新增任務</button></div></form>
<div class="filters"><div><label for="subjectFilter">科目篩選</label><select id="subjectFilter"><option value="">全部科目</option></select></div><div><label for="statusFilter">完成狀態</label><select id="statusFilter"><option value="all">全部</option><option value="pending">未完成</option><option value="done">已完成</option></select></div></div><div class="list" id="list"></div>
</section><section class="panel timer-panel" id="timerPanel" tabindex="-1"><div class="panel-title"><h2>留一段時間給專注</h2><span class="section-number">02 / FOCUS</span></div><label for="taskSelect">目前專注任務</label><select id="taskSelect"><option value="">自由專注</option></select><div class="timer-header"><span class="mode" id="mode">專注時間</span></div><div class="dial" id="dial"><div class="dial-content"><div class="clock" id="clock" role="timer" aria-label="剩餘時間">25:00</div><div class="clock-note" id="clockNote">準備好，就開始吧</div></div></div><div class="current" id="current">自由專注</div><div class="timer-actions"><button class="primary" id="toggle">開始專注</button><button id="reset">重設</button></div><div id="timerNotice" class="notice" role="status"></div><div class="settings"><div><label for="focusMinutes">專注（分鐘）</label><input type="number" id="focusMinutes" value="25" min="1" max="120" step="1" required></div><div><label for="restMinutes">休息（分鐘）</label><input type="number" id="restMinutes" value="5" min="1" max="60" step="1" required></div></div><p class="help" id="settingHelp">可自訂時間；開始後須先重設才能修改。</p><p class="help">計時完成後，手動開始下一階段。任務是否完成由你決定。</p></section></div>
<footer>資料保存在此瀏覽器，不會跨裝置同步。重新整理會重設計時；清除網站資料會移除任務。<br>讀書小幫手 · v1.1</footer></main>
<div id="toast" role="status" aria-live="polite"></div><dialog id="confirmDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle">確認操作</h2><p id="dialogMessage"></p><div class="dialog-actions"><button id="dialogCancel">取消</button><button class="primary" id="dialogOK">確認</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='study-helper-v1';
let tasks=[],settings={focus:25,rest:5},editing=null,toastTimeout,askResolve;
let timer={phase:'focus',state:'idle',remaining:1500000,end:0,selected:''};
function notify(message){$('toast').textContent=message;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').textContent='',5500)}
function warn(message){$('storageWarning').hidden=false;$('storageWarning').textContent=message}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks,settings}))}catch(e){warn('目前無法保存資料。你仍可操作，但關閉或重新整理後，本次修改可能遺失。')}}
function validMinutes(n,max){return Number.isInteger(n)&&n>=1&&n<=max}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!Array.isArray(data.tasks))throw Error();tasks=data.tasks.filter(t=>t&&typeof t.id==='string'&&typeof t.subject==='string'&&t.subject.trim()&&t.subject.length<=30&&typeof t.title==='string'&&t.title.trim()&&t.title.length<=80&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&['high','mid','low'].includes(t.priority)&&typeof t.done==='boolean');if(data.settings&&validMinutes(data.settings.focus,120)&&validMinutes(data.settings.rest,60))settings=data.settings;}const probe=KEY+'-probe';localStorage.setItem(probe,'1');localStorage.removeItem(probe)}catch(e){warn('保存資料無法讀取或瀏覽器不允許儲存。可繼續操作；重要內容請另行記錄。')}}
function dayKey(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function dueHint(t,now=new Date()){if(t.done)return '';const today=dayKey(now),tom=new Date(now);tom.setDate(tom.getDate()+1);return t.due<today?'已逾期':t.due===today?'今天截止':t.due===dayKey(tom)?'明天截止':''}
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function option(value,label){const e=element('option','',label);e.value=value;return e}
function matches(t){return (!$('subjectFilter').value||t.subject===$('subjectFilter').value)&&($('statusFilter').value==='all'||t.done===($('statusFilter').value==='done'))}
function clearForm(){editing=null;$('taskForm').reset();$('formTitle').textContent='安排讀書任務';$('saveTask').textContent='＋ 新增任務';$('cancelEdit').hidden=true;['subject','title'].forEach(id=>$(id).setCustomValidity(''))}
function scrollToEl(id){$(id).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}
function ask(message){$('dialogMessage').textContent=message;return new Promise(resolve=>{askResolve=resolve;$('confirmDialog').showModal();$('dialogCancel').focus()})}
function finishAsk(answer){$('confirmDialog').close();if(askResolve){askResolve(answer);askResolve=null}}
$('dialogCancel').onclick=()=>finishAsk(false);$('dialogOK').onclick=()=>finishAsk(true);$('confirmDialog').addEventListener('cancel',e=>{e.preventDefault();finishAsk(false)});
function renderTasks(){const sf=$('subjectFilter').value;const subjects=[...new Set(tasks.map(t=>t.subject))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));$('subjectFilter').replaceChildren(option('','全部科目'),...subjects.map(s=>option(s,s)));$('subjectFilter').value=subjects.includes(sf)?sf:'';$('subjects').replaceChildren(...subjects.map(s=>option(s,s)));
const complete=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(complete/tasks.length*100):0;$('total').textContent=tasks.length;$('done').textContent=complete;$('pending').textContent=tasks.length-complete;$('percent').textContent=pct+'%';$('bar').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);
const visible=tasks.filter(matches).sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));$('list').replaceChildren();if(!visible.length){const empty=element('div','empty');empty.append(element('b','',tasks.length?'目前沒有符合條件的任務':'從第一個小目標開始'),element('span','',tasks.length?'試試切換科目或完成狀態。':'在上方新增任務，為今天留一個清楚的方向。'));$('list').append(empty)}
for(const t of visible){const card=element('article','task'+(t.done?' done':'')),row=element('div','task-top'),check=element('input','check');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label',(t.done?'改為未完成：':'完成：')+t.title);check.onchange=()=>{t.done=check.checked;if(t.done&&timer.selected===t.id)detachTimer();save();renderTasks()};const body=element('div','task-body');body.append(element('div','subject',t.subject),element('h3','',t.title));const tags=element('div','tags');tags.append(element('span','tag '+t.priority,({high:'高',mid:'中',low:'低'})[t.priority]+'優先'),element('span','muted','截止 '+t.due));const hint=dueHint(t);if(hint)tags.append(element('span','tag '+({'已逾期':'overdue','今天截止':'today','明天截止':'tomorrow'})[hint],hint));body.append(tags);row.append(check,body);card.append(row);const actions=element('div','task-foot');if(!t.done){const b=element('button','focus primary','開始專注');b.onclick=()=>startTask(t.id);actions.append(b)}const edit=element('button','','編輯');edit.onclick=()=>{editing=t.id;for(const key of ['subject','title','due','priority'])$(key).value=t[key];$('formTitle').textContent='編輯讀書任務';$('saveTask').textContent='儲存修改';$('cancelEdit').hidden=false;scrollToEl('taskForm');$('subject').focus({preventScroll:true})};const del=element('button','danger','刪除');del.onclick=async()=>{if(!await ask('確定刪除「'+t.title+'」嗎？此操作無法復原。'))return;tasks=tasks.filter(x=>x.id!==t.id);if(timer.selected===t.id)detachTimer();if(editing===t.id)clearForm();save();renderTasks();notify('任務已刪除。')};actions.append(edit,del);card.append(actions);$('list').append(card)}
$('taskSelect').replaceChildren(option('','自由專注'),...tasks.filter(t=>!t.done).map(t=>option(t.id,t.subject+' · '+t.title)));$('taskSelect').value=timer.selected;renderTimer();}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();for(const id of ['subject','title']){const input=$(id);input.value=input.value.trim();input.setCustomValidity(input.value?'':'請填寫內容，不能只有空格。')}if(!$('taskForm').reportValidity())return;const data={subject:$('subject').value,title:$('title').value,due:$('due').value,priority:$('priority').value};const wasEdit=!!editing;let task;if(editing){task=tasks.find(t=>t.id===editing);if(!task){clearForm();return}Object.assign(task,data)}else{task={id:globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),...data,done:false};tasks.push(task)}save();clearForm();renderTasks();notify((wasEdit?'已儲存修改。':'已新增任務。')+(!matches(task)?'目前篩選條件下不顯示此任務。':''))});
for(const id of ['subject','title'])$(id).addEventListener('input',()=>$(id).setCustomValidity(''));
$('cancelEdit').onclick=clearForm;$('subjectFilter').onchange=renderTasks;$('statusFilter').onchange=renderTasks;
function duration(){return settings[timer.phase]*60000}
function active(){return timer.state==='running'||timer.state==='paused'}
function sync(){if(timer.state==='running'){timer.remaining=Math.max(0,timer.end-Date.now());if(timer.remaining===0){timer.state='finished';notify(timer.phase==='focus'?'這段專注完成了！準備好後開始休息。':'休息結束！準備好後再開始專注。')}}}
function renderTimer(){sync();const locked=active();$('mode').textContent=timer.phase==='focus'?'專注時間':'休息時間';const secs=Math.ceil(timer.remaining/1000);$('clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');$('dial').style.setProperty('--angle',Math.max(0,Math.min(360,360*(1-timer.remaining/duration())))+'deg');$('clockNote').textContent=({idle:'準備好，就開始吧',running:timer.phase==='focus'?'此刻，只做一件事':'放鬆一下，讓思緒呼吸',paused:'已暫停，照自己的節奏',finished:'這一段，完成了'})[timer.state];$('toggle').textContent=timer.state==='running'?'暫停':timer.state==='paused'?'繼續':timer.state==='finished'?(timer.phase==='focus'?'開始休息':'開始專注'):(timer.phase==='focus'?'開始專注':'開始休息');for(const id of ['focusMinutes','restMinutes','taskSelect'])$(id).disabled=locked;$('settingHelp').textContent=locked?'計時已開始。若要修改設定或選單，請先按重設。':'可自訂時間；開始後須先重設才能修改。';const task=tasks.find(t=>t.id===timer.selected);$('current').textContent=task?task.subject+' · '+task.title:'自由專注';$('timerNotice').textContent=timer.state==='finished'?(timer.phase==='focus'?'專注完成！任務不會自動標為完成；準備好後按「開始休息」。':'休息完成！準備好後按「開始專注」。'):'';}
function resetTimer(){timer.state='idle';timer.remaining=duration();timer.end=0;renderTimer()}
function detachTimer(){timer.selected='';resetTimer();notify('目前任務已完成或刪除，計時已重設為自由專注。')}
function readSettings(){for(const [id,max] of [['focusMinutes',120],['restMinutes',60]]){const e=$(id);e.setCustomValidity(validMinutes(Number(e.value),max)?'':'請輸入1～'+max+'的整數分鐘。');if(!e.reportValidity())return false}settings={focus:Number($('focusMinutes').value),rest:Number($('restMinutes').value)};save();return true}
for(const id of ['focusMinutes','restMinutes']){$(id).oninput=()=>$(id).setCustomValidity('');$(id).onchange=()=>{if(!active()&&readSettings())resetTimer()}}
$('taskSelect').onchange=()=>{timer.selected=$('taskSelect').value;renderTimer()};
$('toggle').onclick=()=>{sync();if(timer.state==='running'){timer.state='paused'}else if(timer.state==='paused'){timer.end=Date.now()+timer.remaining;timer.state='running'}else{if(!readSettings())return;if(timer.state==='finished')timer.phase=timer.phase==='focus'?'rest':'focus';timer.remaining=duration();timer.end=Date.now()+timer.remaining;timer.state='running'}renderTimer()};$('reset').onclick=()=>{resetTimer();notify('計時已重設。')};
async function startTask(id){sync();if(active()&&!await ask('是否放棄本次計時，並開始這項任務的專注計時？'))return;if(!tasks.some(t=>t.id===id&&!t.done))return;if(!readSettings())return;timer.selected=id;timer.phase='focus';timer.remaining=duration();timer.end=Date.now()+timer.remaining;timer.state='running';$('taskSelect').value=id;renderTimer();scrollToEl('timerPanel');$('timerPanel').focus({preventScroll:true})}
load();$('focusMinutes').value=settings.focus;$('restMinutes').value=settings.rest;timer.remaining=duration();let lastDay=dayKey(new Date());renderTasks();setInterval(()=>{renderTimer();const today=dayKey(new Date());if(today!==lastDay){lastDay=today;renderTasks()}},250);document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastDay=dayKey(new Date());renderTasks()}});
</script></body></html>
